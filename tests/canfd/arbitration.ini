[Config Mixed11And29]
network = fico4omnet.examples.can.arbitration.Canbus
sim-time-limit = 5ms
**.bus.version = "2.0B"
**.bus.bandwidth = 500kbps
**.bus.bitStuffingPercentage = 0
**.bus.fdCapable = true
**.bus.arbitrationBitrate = 500kbps
**.bus.dataBitrate = 2Mbps
**.bus.canBusLogic.rxCANIdDF.result-recording-modes = vector
**.errorperc = 0
**.bufferIn[0].idIncomingFrames = "291"
**.sourceApp[0].periodicityDataFrames = "0.010"
**.sourceApp[0].dataLengthDataFrames = "8"
**.sourceApp[0].initialDataFrameOffset = "0.001"
*.node[0].sourceApp[0].idDataFrames = "1"
*.node[0].sourceApp[0].identifierFormat = "standard"
*.node[1].sourceApp[0].identifierFormat = "extended"
*.node[1].sourceApp[0].idDataFrames = "262147"

[Config DuplicateOwners]
extends = Mixed11And29
*.node[0].sourceApp[0].idDataFrames = "291,291"
*.node[0].sourceApp[0].dataLengthDataFrames = "8,8"
*.node[0].sourceApp[0].periodicityDataFrames = "0.010,0.010"
*.node[0].sourceApp[0].initialDataFrameOffset = "0.001,0.001"
*.node[1].sourceApp[0].idDataFrames = "291"
*.node[1].sourceApp[0].identifierFormat = "standard"

[Config QueuedPeriodicSameId]
*.node[0].bufferOut.MOB = false
extends = Mixed11And29
sim-time-limit = 15ms
*.node[0].sourceApp[0].dataLengthDataFrames = "64"
*.node[0].sourceApp[0].fd = true
*.node[0].sourceApp[0].periodicityDataFrames = "0.001"
*.node[0].sourceApp[0].initialDataFrameOffset = "0.001"
*.node[1].sourceApp[0].idDataFrames = "0"

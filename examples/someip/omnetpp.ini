[General]
network = someip.SomeIpSmallNetwork
sim-time-limit = 5s
cmdenv-express-mode = true
cmdenv-autoflush = true
seed-set = 1
**.scalar-recording = true
**.vector-recording = true

# Fixed addresses (used by the wire checks in tests/test_someip.py).
*.configurator.config = xml("<config><interface hosts='Node1' names='eth0' address='10.0.0.1' netmask='255.255.255.0'/><interface hosts='Node2' names='eth0' address='10.0.0.2' netmask='255.255.255.0'/><interface hosts='Node3' names='eth0' address='10.0.0.3' netmask='255.255.255.0'/></config>")

# SOA4CoRE INET4 port: SOME/IP manager and SOME/IP-SD in every middleware.
**.middleware.sm.typename = "soa4core.manager.someip.SomeIpManager"
**.middleware.sd.typename = "soa4core.discovery.someip.SomeIpSD"
**.middleware.sm.initialDelayMin = 0.1s
**.middleware.sm.initialDelayMax = 0.2s
**.middleware.sm.repetitionsMax = 3
**.middleware.sm.repititionBaseDelay = 0.1s
**.middleware.sm.cyclicOfferDelay = 2s
**.Node2.middleware.sm.initialDelayMin = 0.05s
**.Node2.middleware.sm.initialDelayMax = 0.05s

# Endpoint processing times (as in the original example)
**.publisherEndpoints[*].allowParallelProcessing = false
**.publisherEndpoints[*].processingTime = 20ns
**.subscriberEndpoints[*].allowParallelProcessing = false
**.subscriberEndpoints[*].processingTime = 20ns

# Node1: publisher of service 1 over SOME/IP UDP, UDP multicast and TCP
*.Node1.localAddress = "Node1"
*.Node1.numServices = 1
*.Node1.services[0].typename = "soa4core.applications.publisher.base.Publisher"
*.Node1.services[0].serviceName = "service1Publisher"
*.Node1.services[0].qosGroups = "SOMEIP_UDP SOMEIP_UDP_MCAST SOMEIP_TCP"
*.Node1.services[0].interval = 0.1s
*.Node1.services[0].payloadMax = 64B
*.Node1.services[0].applicationTCPPort = 3171
*.Node1.services[0].applicationUDPPort = 3171
*.Node1.services[0].mcastDestAddress = "225.0.1.42"
*.Node1.services[0].mcastDestPort = 13171
*.Node1.services[0].serviceId = 1
*.Node1.services[0].instanceID = 0x0001
*.Node1.services[0].eventId = 0x8001
*.Node1.services[0].eventgroupId = 1

# Node2: subscriber of instance 1 (SOME/IP TCP by default)
*.Node2.localAddress = "Node2"
*.Node2.numServices = 1
*.Node2.services[0].typename = "soa4core.applications.subscriber.base.Subscriber"
*.Node2.services[0].serviceId = 1
*.Node2.services[0].serviceName = "service1Subscriber"
*.Node2.services[0].applicationTCPPort = 3172
*.Node2.services[0].applicationUDPPort = 3172
*.Node2.services[0].instanceID = 0x0001
*.Node2.services[0].qosGroup = "SOMEIP_TCP"

# Node3: subscriber of any instance (0xFFFF) over SOME/IP UDP
*.Node3.localAddress = "Node3"
*.Node3.numServices = 1
*.Node3.services[0].typename = "soa4core.applications.subscriber.base.Subscriber"
*.Node3.services[0].serviceName = "service3Subscriber"
*.Node3.services[0].serviceId = 1
*.Node3.services[0].qosGroup = "SOMEIP_UDP"
*.Node3.services[0].applicationTCPPort = 3173
*.Node3.services[0].applicationUDPPort = 3173
*.Node3.services[0].instanceID = 0xFFFF

# Wire capture of every host (nanosecond pcap). Computed FCS makes INET serialize
# every frame, so the SOME/IP and SOME/IP-SD serializers are exercised byte-exactly.
**.fcsMode = "computed"
**.checksumMode = "computed"
*.Node*.recordPcap = true
*.Node*.pcapRecorder[0].fileFormat = "pcap"
*.Node*.pcapRecorder[0].timePrecision = 9
*.Node1.pcapRecorder[0].pcapFile = "${resultdir}/Node1.pcap"
*.Node2.pcapRecorder[0].pcapFile = "${resultdir}/Node2.pcap"
*.Node3.pcapRecorder[0].pcapFile = "${resultdir}/Node3.pcap"

[Config SomeIpTcpUdp]
description = "SOME/IP-SD; Node2 subscribes via SOME/IP TCP, Node3 via SOME/IP UDP"

[Config SomeIpUdpOnly]
description = "SOME/IP-SD; both subscribers use SOME/IP UDP (unicast)"
*.Node2.services[0].qosGroup = "SOMEIP_UDP"

[Config SomeIpUdpMcast]
description = "SOME/IP-SD; both subscribers join the SOME/IP UDP multicast eventgroup"
*.Node2.services[0].qosGroup = "SOMEIP_UDP_MCAST"
*.Node3.services[0].qosGroup = "SOMEIP_UDP_MCAST"

# SOME/IP over INET TSN devices: the publisher's pcp/vlan_id become IEEE 802.1Q
# C-tags (PCP 5, VID 10) on its UDP notifications. TCP segments are generated by
# the TCP module and stay untagged (use TSN stream identification for them).
[Config SomeIpTsnPcp]
description = "SOME/IP UDP + UDP multicast on INET TsnDevice hosts; publisher PCP 5 / VLAN 10"
*.Node*.typename = "soa4core.nodes.MiddlewareTsnHost"
*.Switch.typename = "inet.node.tsn.TsnSwitch"
**.eth[*].bitrate = 100Mbps
*.Node*.hasOutgoingStreams = true
*.Node*.hasIncomingStreams = true
*.Node1.services[0].pcp = 5
*.Node1.services[0].vlan_id = 10
*.Node2.services[0].qosGroup = "SOMEIP_UDP_MCAST"
*.Node3.services[0].qosGroup = "SOMEIP_UDP"

# ---------------------------------------------------------------------------
# AUTOSAR E2E + SecOC on the event notifications (docs/PROTECTION.md). SOME/IP-SD
# is not protected by E2E (AUTOSAR scope). The Publisher protects per endpoint,
# the subscriber endpoints verify SecOC, then E2E; only OK/OKSOMELOST is delivered.
# Wire payload: | E2E P04 header (12 B) | 64 B event data | FV (32 LSB) | MAC (64 MSB) |
[Config SomeIpE2eSecOc]
description = "SOME/IP events with E2E Profile 4 inside SecOC (AES-128-CMAC); TCP and UDP subscribers"
extends = SomeIpTcpUdp
**.services[0].e2eProfile = "P04"
**.services[0].e2eMaxDeltaCounter = 2
**.services[0].secocEnabled = true
**.services[0].secocKey = "2b7e151628aed2a6abf7158809cf4f3c"
**.services[0].secocFreshnessTxBits = 32
**.services[0].secocMacTxBits = 64

# Profile 7 (CRC-64) with the complete 64 bit FV and the full 128 bit MAC on UDP multicast.
[Config SomeIpE2eP07Mcast]
description = "SOME/IP UDP multicast events with E2E Profile 7 and SecOC (full FV, 128 bit MAC)"
extends = SomeIpUdpMcast
**.services[0].e2eProfile = "P07"
**.services[0].secocEnabled = true
**.services[0].secocKey = "2b7e151628aed2a6abf7158809cf4f3c"
**.services[0].secocFreshnessTxBits = 64
**.services[0].secocMacTxBits = 128

# Per publisher endpoint: message 10 has a bit error, 20 replays 19, 30 skips 3 counters.
[Config SomeIpE2eSecOcFaults]
description = "SomeIpE2eSecOc with bit error, replay and counter jump on the publisher side"
extends = SomeIpE2eSecOc
*.Node1.services[0].faultCorruptAt = "10"
*.Node1.services[0].faultReplayAt = "20"
*.Node1.services[0].faultSkipAt = "30"

[Config SomeIpSecOcWrongKey]
description = "Node3 verifies with a different key: all its notifications fail SecOC"
extends = SomeIpE2eSecOc
*.Node3.services[0].secocKey = "2b7e151628aed2a6abf7158809cf4f3d"

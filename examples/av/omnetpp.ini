[General]
network = av.AvNetwork
sim-time-limit = 1s
cmdenv-express-mode = true
cmdenv-autoflush = true
seed-set = 1
**.scalar-recording = true
**.vector-recording = true

# Native INET 4 Ethernet, no IP.
**.hasIpv4 = false
**.hasIpv6 = false
**.hasUdp = false
**.hasTcp = false
**.hasSctp = false
**.hasQuic = false
**.eth[*].csmacdSupport = false
*.tuner.eth[0].address = "02-00-00-00-01-01"
*.headUnit.eth[0].address = "02-00-00-00-01-02"
*.rearDisplay.eth[0].address = "02-00-00-00-01-03"
*.background.eth[0].address = "02-00-00-00-01-04"

# Tuner ECU: three IEEE 1722 talkers. The broadcast-derived media clock runs 25 ppm
# fast against gPTP (audio sample clock and MPEG-2 system clock locked to it).
*.tuner.app[0].numTalkers = 3
**.talker[*].mediaClockPpm = 25
# Digital radio: decoded audio, AAF PCM 48 kHz, stereo, 16 bit, SR class A (6 samples/PDU).
*.tuner.app[0].talker[0].typename = "signalsandgateways.inet4.avtp.media.AafTalker"
*.tuner.app[0].talker[0].destAddress = "91-E0-F0-00-FE-10"
*.tuner.app[0].talker[0].streamUniqueId = 1
# Digital TV: the MPEG-2 transport stream (16 Mbit/s) as IEC 61883-4, SR class B.
*.tuner.app[0].talker[1].typename = "signalsandgateways.inet4.avtp.media.Iec61883TsTalker"
*.tuner.app[0].talker[1].destAddress = "91-E0-F0-00-FE-11"
*.tuner.app[0].talker[1].streamUniqueId = 2
# Media clock reference of the audio sample clock (CRF, 48 kHz, 6 timestamps/PDU).
*.tuner.app[0].talker[2].typename = "signalsandgateways.inet4.avtp.media.CrfTalker"
*.tuner.app[0].talker[2].destAddress = "91-E0-F0-00-FE-12"
*.tuner.app[0].talker[2].streamUniqueId = 3

# Head unit: radio audio, TV stream and media clock.
*.headUnit.app[0].numListeners = 3
*.headUnit.app[0].listener[0].typename = "signalsandgateways.inet4.avtp.media.AafListener"
*.headUnit.app[0].listener[0].listenAddress = "91-E0-F0-00-FE-10"
*.headUnit.app[0].listener[0].listenStreamId = "0x0200000001010001"
*.headUnit.app[0].listener[1].typename = "signalsandgateways.inet4.avtp.media.Iec61883TsListener"
*.headUnit.app[0].listener[1].listenAddress = "91-E0-F0-00-FE-11"
*.headUnit.app[0].listener[1].listenStreamId = "0x0200000001010002"
*.headUnit.app[0].listener[2].typename = "signalsandgateways.inet4.avtp.media.CrfListener"
*.headUnit.app[0].listener[2].listenAddress = "91-E0-F0-00-FE-12"
*.headUnit.app[0].listener[2].listenStreamId = "0x0200000001010003"
# Rear seat display: TV stream only.
*.rearDisplay.app[0].numListeners = 1
*.rearDisplay.app[0].listener[0].typename = "signalsandgateways.inet4.avtp.media.Iec61883TsListener"
*.rearDisplay.app[0].listener[0].listenAddress = "91-E0-F0-00-FE-11"
*.rearDisplay.app[0].listener[0].listenStreamId = "0x0200000001010002"

# Best-effort load source (migrated CoRE4INET application), idle unless configured.
*.background.app[0].typename = "core4inet.applications.trafficsource.base.BGTrafficSourceApp"
*.background.app[0].destAddress = "02-00-00-00-01-99"
*.background.app[0].payload = 1400Byte
*.background.app[0].enabled = false

# Wire capture (nanosecond pcap); computed FCS serializes every frame byte-exactly.
**.fcsMode = "computed"
*.tuner.recordPcap = true
*.headUnit.recordPcap = true
*.rearDisplay.recordPcap = true
**.pcapRecorder[0].fileFormat = "pcap"
**.pcapRecorder[0].timePrecision = 9
*.tuner.pcapRecorder[0].pcapFile = "${resultdir}/tuner.pcap"
*.headUnit.pcapRecorder[0].pcapFile = "${resultdir}/headUnit.pcap"
*.rearDisplay.pcapRecorder[0].pcapFile = "${resultdir}/rearDisplay.pcap"

[Config AvBasic]
description = "Radio audio (AAF), TV transport stream (IEC 61883-4) and media clock (CRF), ideal time, no load"

# ~104% best-effort load to a MAC address nobody owns: the switch floods it to every
# port, so it competes with the AV streams at the listener ports (no TSN).
[Config AvOverload]
description = "AV streams with an overloaded best-effort switch egress (no TSN)"
*.background.app[0].enabled = true
*.background.app[0].sendInterval = 110us
*.background.app[0].startTime = 100ms
*.background.app[0].stopTime = 900ms

# Same load with INET TSN: 802.1Q stream tags (class A: PCP 3 for audio and clock,
# class B: PCP 2 for the TV stream, VID 2), credit-based shapers in the switch and
# static multicast forwarding (the entries SRP/MSRP would install).
[Config AvTsn]
description = "AV streams over INET TSN: SR class A/B, credit-based shapers, overloaded egress"
extends = AvOverload
*.tuner.typename = "AvTsnHost"
*.headUnit.typename = "AvTsnHost"
*.rearDisplay.typename = "AvTsnHost"
*.background.typename = "TsnLoadHost"
*.background.ethernet.hasSocketSupport = true
*.switch.typename = "inet.node.tsn.TsnSwitch"
**.eth[*].bitrate = 100Mbps
*.tuner.hasOutgoingStreams = true
*.headUnit.hasIncomingStreams = true
*.rearDisplay.hasIncomingStreams = true
*.tuner.bridging.streamIdentifier.identifier.mapping = [{stream: "radio", packetFilter: "AVTP-AAF*"}, {stream: "tv", packetFilter: "AVTP-61883*"}, {stream: "clock", packetFilter: "AVTP-CRF*"}]
*.tuner.bridging.streamCoder.encoder.mapping = [{stream: "radio", pcp: 3, vlan: 2}, {stream: "tv", pcp: 2, vlan: 2}, {stream: "clock", pcp: 3, vlan: 2}]
*.switch.hasEgressTrafficShaping = true
# Egress classes: 0 best effort, 1 TV (class B), 2 radio audio (class A), 3 media clock, 4 gPTP.
*.switch.eth[*].macLayer.queue.numTrafficClasses = 5
*.switch.eth[*].macLayer.queue.classifier.typename = "ContentBasedClassifier"
*.switch.eth[*].macLayer.queue.classifier.packetFilters = ["Best-Effort*", "AVTP-61883*", "AVTP-AAF*", "AVTP-CRF*", "Gptp*"]
*.switch.eth[*].macLayer.queue.transmissionSelectionAlgorithm[1].typename = "Ieee8021qCreditBasedShaper"
*.switch.eth[*].macLayer.queue.transmissionSelectionAlgorithm[1].idleSlope = 25Mbps
*.switch.eth[*].macLayer.queue.transmissionSelectionAlgorithm[2].typename = "Ieee8021qCreditBasedShaper"
*.switch.eth[*].macLayer.queue.transmissionSelectionAlgorithm[2].idleSlope = 8Mbps
*.switch.eth[*].macLayer.queue.transmissionSelectionAlgorithm[3].typename = "Ieee8021qCreditBasedShaper"
*.switch.eth[*].macLayer.queue.transmissionSelectionAlgorithm[3].idleSlope = 1Mbps
*.switch.macTable.forwardingTable = [{address: "91-E0-F0-00-FE-10", vlan: 2, interface: "eth1"},
                                     {address: "91-E0-F0-00-FE-11", vlan: 2, interface: "eth1"},
                                     {address: "91-E0-F0-00-FE-11", vlan: 2, interface: "eth2"},
                                     {address: "91-E0-F0-00-FE-12", vlan: 2, interface: "eth1"}]

# gPTP: the tuner is grandmaster, the switch a bridge; oscillators drift +/-50 ppm.
[Config AvTsnGptp]
description = "AvTsn with gPTP time synchronization (+/-50 ppm oscillators)"
extends = AvTsn
*.tuner.hasTimeSynchronization = true
*.headUnit.hasTimeSynchronization = true
*.rearDisplay.hasTimeSynchronization = true
*.switch.hasTimeSynchronization = true
*.tuner.app[0].clockModule = "^.clock"
*.headUnit.app[0].clockModule = "^.clock"
*.rearDisplay.app[0].clockModule = "^.clock"
*.tuner.clock.oscillator.typename = "ConstantDriftOscillator"
*.headUnit.clock.oscillator.typename = "ConstantDriftOscillator"
*.rearDisplay.clock.oscillator.typename = "ConstantDriftOscillator"
*.tuner.clock.oscillator.driftRate = 50ppm
*.headUnit.clock.oscillator.driftRate = -50ppm
*.rearDisplay.clock.oscillator.driftRate = 30ppm
**.oscillator.nominalTickLength = 10ns
*.tuner.gptp.gptpNodeType = "MASTER_NODE"
*.tuner.gptp.masterPorts = ["eth0"]
*.tuner.gptp.slavePort = ""
*.switch.gptp.masterPorts = ["eth1", "eth2"]
**.gptp.syncInterval = 1ms
**.gptp.pdelayInterval = 10ms
**.gptp.pdelayInitialOffset = 0s
**.eth[*].phyLayer.transmitter.typename = "StreamingTransmitter"
**.eth[*].phyLayer.receiver.typename = "DestreamingReceiver"
# Streams start after the clocks have converged.
**.talker[*].startTime = 100ms

# Same drifting oscillators without gPTP: talker and listeners use free-running clocks.
[Config AvTsnFreeRunning]
description = "AvTsn with +/-50 ppm oscillators and no time synchronization (comparison)"
extends = AvTsn
*.tuner.clock.typename = "SettableClock"
*.headUnit.clock.typename = "SettableClock"
*.rearDisplay.clock.typename = "SettableClock"
*.tuner.app[0].clockModule = "^.clock"
*.headUnit.app[0].clockModule = "^.clock"
*.rearDisplay.app[0].clockModule = "^.clock"
*.tuner.clock.oscillator.typename = "ConstantDriftOscillator"
*.headUnit.clock.oscillator.typename = "ConstantDriftOscillator"
*.rearDisplay.clock.oscillator.typename = "ConstantDriftOscillator"
*.tuner.clock.oscillator.driftRate = 50ppm
*.headUnit.clock.oscillator.driftRate = -50ppm
*.rearDisplay.clock.oscillator.driftRate = 30ppm
**.oscillator.nominalTickLength = 10ns
**.talker[*].startTime = 100ms

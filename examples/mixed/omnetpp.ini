[General]
network = mixed.MixedCanEthernet
sim-time-limit = 100ms
cmdenv-express-mode = true
cmdenv-autoflush = true
seed-set = 1
**.scalar-recording = true
**.vector-recording = true

# Native INET 4 Ethernet interfaces and switch, no IP traffic required.
**.hasIpv4 = false
**.hasIpv6 = false
**.hasUdp = false
**.hasTcp = false
**.hasSctp = false
**.hasQuic = false
**.eth[*].csmacdSupport = false
*.gatewayA.eth[0].address = "02-00-00-00-00-01"
*.gatewayB.eth[0].address = "02-00-00-00-00-02"
*.background.eth[0].address = "02-00-00-00-00-03"
*.receiver.eth[0].address = "02-00-00-00-00-04"
*.gatewayA.app[0].localAddress = "02-00-00-00-00-01"
*.gatewayA.app[0].remoteAddress = "02-00-00-00-00-02"
*.gatewayB.app[0].localAddress = "02-00-00-00-00-02"
*.gatewayB.app[0].remoteAddress = "02-00-00-00-00-01"
*.gateway*.app[0].processingDelay = 5us

# Genuine migrated CoRE4INET best-effort Ethernet traffic source/sink.
*.background.app[0].typename = "core4inet.applications.trafficsource.base.BGTrafficSourceApp"
*.background.app[0].destAddress = "02-00-00-00-00-04"
*.background.app[0].payload = 512Byte
*.background.app[0].sendInterval = 1ms
*.background.app[0].startTime = 1ms
*.background.app[0].stopTime = 90ms
*.receiver.app[0].typename = "core4inet.applications.trafficsource.base.BGTrafficSourceApp"
*.receiver.app[0].enabled = false
*.receiver.app[0].destAddress = ""
*.receiver.app[0].localAddress = "02-00-00-00-00-04"

# Both directions traverse CAN -> gateway -> Ethernet switch -> gateway -> CAN.
# Local CAN receive filters prevent a gateway from reflecting imported frames.
*.bus*.bandwidth = 500kbps
*.bus*.bitStuffingPercentage = 0
*.bus*.fdCapable = true
*.bus*.dataBitrate = 2Mbps
*.gatewayA.canPort.bufferIn[0].idIncomingFrames = "256,512"
*.gatewayB.canPort.bufferIn[0].idIncomingFrames = "768,1024"
*.ecuA[*].bufferIn[0].idIncomingFrames = "768,1024"
*.ecuB[*].bufferIn[0].idIncomingFrames = "256,512"
*.ecu*[*].sinkApp[0].typename = "signalsandgateways.inet4.AuditCanSink"
*.ecu*[*].bufferOut.MOB = false
*.ecuA[0].sourceApp[0].idDataFrames = "256"
*.ecuA[1].sourceApp[0].idDataFrames = "512"
*.ecuB[0].sourceApp[0].idDataFrames = "768"
*.ecuB[1].sourceApp[0].idDataFrames = "1024"
*.ecu*[*].sourceApp[0].periodicityDataFrames = "0.010"
*.ecu*[*].sourceApp[0].initialDataFrameOffset = "0.001"
*.ecu*[0].sourceApp[0].dataLengthDataFrames = "8"
*.ecu*[1].sourceApp[0].dataLengthDataFrames = "64"
*.ecu*[1].sourceApp[0].fd = true
*.ecu*[1].sourceApp[0].bitRateSwitch = true

[Config Mixed]
description = "Classical CAN 8B and CAN-FD 64B over 100Mbps switched Ethernet, both directions"

[Config Classic]
description = "Classical CAN only, both directions"
*.bus*.fdCapable = false
*.ecu*[1].sourceApp[0].fd = false
*.ecu*[1].sourceApp[0].bitRateSwitch = false
*.ecu*[1].sourceApp[0].dataLengthDataFrames = "8"

[Config FdNoBrs]
description = "CAN-FD without bit rate switching"
*.ecu*[1].sourceApp[0].bitRateSwitch = false

[Config LoadedEthernet]
description = "Mixed CAN/CAN-FD with high Ethernet background load"
*.background.app[0].sendInterval = 150us
*.background.app[0].payload = 1400Byte

[General]
network = mixed.MixedCanEthernet
sim-time-limit = 100ms
cmdenv-express-mode = true
cmdenv-autoflush = true
seed-set = 1
**.scalar-recording = true
**.vector-recording = true

# Native INET 4 Ethernet interfaces and switch, no IP traffic required.
**.hasIpv4 = false
**.hasIpv6 = false
**.hasUdp = false
**.hasTcp = false
**.hasSctp = false
**.hasQuic = false
**.eth[*].csmacdSupport = false
*.gatewayA.eth[0].address = "02-00-00-00-00-01"
*.gatewayB.eth[0].address = "02-00-00-00-00-02"
*.background.eth[0].address = "02-00-00-00-00-03"
*.receiver.eth[0].address = "02-00-00-00-00-04"
*.gatewayA.app[0].localAddress = "02-00-00-00-00-01"
*.gatewayA.app[0].remoteAddress = "02-00-00-00-00-02"
*.gatewayB.app[0].localAddress = "02-00-00-00-00-02"
*.gatewayB.app[0].remoteAddress = "02-00-00-00-00-01"
*.gateway*.app[0].processingDelay = 5us

# Genuine migrated CoRE4INET best-effort Ethernet traffic source/sink.
*.background.app[0].typename = "core4inet.applications.trafficsource.base.BGTrafficSourceApp"
*.background.app[0].destAddress = "02-00-00-00-00-04"
*.background.app[0].payload = 512Byte
*.background.app[0].sendInterval = 1ms
*.background.app[0].startTime = 1ms
*.background.app[0].stopTime = 90ms
*.receiver.app[0].typename = "core4inet.applications.trafficsource.base.BGTrafficSourceApp"
*.receiver.app[0].enabled = false
*.receiver.app[0].destAddress = ""
*.receiver.app[0].localAddress = "02-00-00-00-00-04"

# Both directions traverse CAN -> gateway -> Ethernet switch -> gateway -> CAN.
# Local CAN receive filters prevent a gateway from reflecting imported frames.
*.bus*.bandwidth = 500kbps
*.bus*.bitStuffingPercentage = 0
*.bus*.fdCapable = true
*.bus*.dataBitrate = 2Mbps
*.gatewayA.canPort.bufferIn[0].idIncomingFrames = "256,512"
*.gatewayB.canPort.bufferIn[0].idIncomingFrames = "768,1024"
*.ecuA[*].bufferIn[0].idIncomingFrames = "768,1024"
*.ecuB[*].bufferIn[0].idIncomingFrames = "256,512"
*.ecu*[*].sinkApp[0].typename = "signalsandgateways.inet4.AuditCanSink"
*.ecu*[*].bufferOut.MOB = false
*.ecuA[0].sourceApp[0].idDataFrames = "256"
*.ecuA[1].sourceApp[0].idDataFrames = "512"
*.ecuB[0].sourceApp[0].idDataFrames = "768"
*.ecuB[1].sourceApp[0].idDataFrames = "1024"
*.ecu*[*].sourceApp[0].periodicityDataFrames = "0.010"
*.ecu*[*].sourceApp[0].initialDataFrameOffset = "0.001"
*.ecu*[0].sourceApp[0].dataLengthDataFrames = "8"
*.ecu*[1].sourceApp[0].dataLengthDataFrames = "64"
*.ecu*[1].sourceApp[0].fd = true
*.ecu*[1].sourceApp[0].bitRateSwitch = true

[Config Mixed]
description = "Classical CAN 8B and CAN-FD 64B over 100Mbps switched Ethernet, both directions"

[Config Classic]
description = "Classical CAN only, both directions"
*.bus*.fdCapable = false
*.ecu*[1].sourceApp[0].fd = false
*.ecu*[1].sourceApp[0].bitRateSwitch = false
*.ecu*[1].sourceApp[0].dataLengthDataFrames = "8"

[Config FdNoBrs]
description = "CAN-FD without bit rate switching"
*.ecu*[1].sourceApp[0].bitRateSwitch = false

[Config LoadedEthernet]
description = "Mixed CAN/CAN-FD with high Ethernet background load"
*.background.app[0].sendInterval = 150us
*.background.app[0].payload = 1400Byte

# ---------------------------------------------------------------------------
# IEEE 1722-2016 AVTP (EtherType 0x22F0) instead of the logical tunnel above.
# Each gateway is an AVTP talker (its own multicast stream) and a listener of
# the peer's stream. Stream ID = talker MAC << 16 | streamUniqueId (default 1).
[Config AvtpNtscf]
description = "Mixed CAN/CAN-FD as IEEE 1722 NTSCF + ACF CAN (with message timestamps)"
*.gateway*.app[0].typename = "signalsandgateways.inet4.avtp.AvtpCanGatewayApp"
*.gateway*.app[0].format = "ntscf"
*.gatewayA.app[0].canBusId = 1
*.gatewayA.app[0].destAddress = "91-E0-F0-00-FE-01"
*.gatewayA.app[0].listenAddress = "91-E0-F0-00-FE-02"
*.gatewayA.app[0].listenStreamId = "0x0200000000020001"
*.gatewayA.app[0].acceptCanBusId = 2
*.gatewayB.app[0].canBusId = 2
*.gatewayB.app[0].destAddress = "91-E0-F0-00-FE-02"
*.gatewayB.app[0].listenAddress = "91-E0-F0-00-FE-01"
*.gatewayB.app[0].listenStreamId = "0x0200000000010001"
*.gatewayB.app[0].acceptCanBusId = 1
# Wire capture of every AVTPDU (nanosecond pcap, readable by Wireshark). Computed
# FCS makes INET serialize every frame, so all chunks are exercised byte-exactly.
**.fcsMode = "computed"
*.gateway*.recordPcap = true
*.gateway*.pcapRecorder[0].fileFormat = "pcap"
*.gateway*.pcapRecorder[0].timePrecision = 9
*.gatewayA.pcapRecorder[0].pcapFile = "${resultdir}/gatewayA.pcap"
*.gatewayB.pcapRecorder[0].pcapFile = "${resultdir}/gatewayB.pcap"

[Config AvtpTscf]
description = "IEEE 1722 TSCF + ACF CAN; listeners release frames at the presentation time"
extends = AvtpNtscf
*.gateway*.app[0].format = "tscf"
*.gateway*.app[0].maxTransitTime = 500us

[Config AvtpBriefAggregated]
description = "IEEE 1722 NTSCF + ACF CAN Brief, two CAN frames aggregated per AVTPDU"
extends = AvtpNtscf
*.gateway*.app[0].acfMessageType = "canBrief"
*.gateway*.app[0].maxAcfMessagesPerPdu = 2
*.gateway*.app[0].aggregationTimeout = 2ms

[Config AvtpLoadedEthernet]
description = "IEEE 1722 TSCF under ~75 Mbps Ethernet background load"
extends = AvtpTscf
*.background.app[0].sendInterval = 150us
*.background.app[0].payload = 1400Byte

[Config AvtpFdNoBrs]
description = "IEEE 1722 NTSCF + ACF CAN; CAN-FD 64B frames without bit rate switching"
extends = AvtpNtscf
*.ecu*[1].sourceApp[0].bitRateSwitch = false

# ---------------------------------------------------------------------------
# Congested switch egress: ~104% best-effort load to a MAC address nobody owns.
# The switch floods it to every port, so it shares the gateway ports with the
# AVTP streams; the gateways' NICs discard it (not addressed to them).
[Config AvtpTscfOverload]
description = "IEEE 1722 TSCF, switch egress to the gateways overloaded by best-effort traffic (no TSN)"
extends = AvtpTscf
*.background.app[0].destAddress = "02-00-00-00-00-99"
*.background.app[0].payload = 1400Byte
*.background.app[0].sendInterval = 110us

# Same load with INET TSN: AVTP frames carry an 802.1Q C-tag (PCP 3 / VID 2,
# SR class A); the TSN switch serves them from a higher traffic class through
# a credit-based shaper (802.1Qav), best effort stays in class 0.
[Config AvtpTsn]
description = "IEEE 1722 TSCF over INET TSN: 802.1Q PCP 3 stream + credit-based shaper, overloaded egress"
extends = AvtpTscfOverload
*.gateway*.typename = "CanTsnHost"
*.background.typename = "TsnEthernetHost"
*.receiver.typename = "TsnEthernetHost"
# The CoRE background source/sink use EthernetSocketIo sockets.
*.background.ethernet.hasSocketSupport = true
*.receiver.ethernet.hasSocketSupport = true
*.switch.typename = "inet.node.tsn.TsnSwitch"
# Modular (layered) Ethernet interfaces need the bitrate explicitly.
**.eth[*].bitrate = 100Mbps
*.gateway*.hasOutgoingStreams = true
*.gateway*.hasIncomingStreams = true
*.gateway*.bridging.streamIdentifier.identifier.mapping = [{stream: "avtp-can", packetFilter: "AVTP-*"}]
*.gateway*.bridging.streamCoder.encoder.mapping = [{stream: "avtp-can", pcp: 3, vlan: 2}]
*.switch.hasEgressTrafficShaping = true
# 4 traffic classes: PCP 0 -> class 0 (best effort), PCP 3 -> class 1 (802.1Q Table 8-5)
*.switch.eth[*].macLayer.queue.numTrafficClasses = 4
*.switch.eth[*].macLayer.queue.transmissionSelectionAlgorithm[1].typename = "Ieee8021qCreditBasedShaper"
*.switch.eth[*].macLayer.queue.transmissionSelectionAlgorithm[1].idleSlope = 5Mbps
# Static multicast registration (what SRP/MSRP listener registration would install):
# each AVTP stream address is forwarded only to its listener port on VLAN 2.
*.switch.macTable.forwardingTable = [{address: "91-E0-F0-00-FE-01", vlan: 2, interface: "eth1"},
                                     {address: "91-E0-F0-00-FE-02", vlan: 2, interface: "eth0"}]

# gPTP (IEEE 802.1AS): gatewayA is grandmaster, the TSN switch is a bridge,
# gatewayB is a slave. Gateway oscillators drift by +/-50 ppm; the AVTP gateways
# read the synchronized node clock as gPTP time (avtp_timestamp, message_timestamp,
# presentation). presentationError = release instant - talker's intended instant.
[Config AvtpTsnGptp]
description = "IEEE 1722 TSCF over INET TSN with gPTP time synchronization (+/-50 ppm oscillators)"
extends = AvtpTsn
*.gateway*.hasTimeSynchronization = true
*.switch.hasTimeSynchronization = true
*.gateway*.app[0].clockModule = "^.clock"
*.gateway*.clock.oscillator.typename = "ConstantDriftOscillator"
*.gateway*.clock.oscillator.nominalTickLength = 10ns
*.gatewayA.clock.oscillator.driftRate = 50ppm
*.gatewayB.clock.oscillator.driftRate = -50ppm
*.gatewayA.gptp.gptpNodeType = "MASTER_NODE"
*.gatewayA.gptp.masterPorts = ["eth0"]
*.gatewayA.gptp.slavePort = ""
*.switch.gptp.masterPorts = ["eth1"]
**.gptp.syncInterval = 1ms
**.gptp.pdelayInterval = 10ms
**.gptp.pdelayInitialOffset = 0s
# gPTP messages must not queue behind best effort (INET's gptpandtas showcase does
# the same): switch egress classes 0 = best effort, 1 = AVTP (CBS), 2 = gPTP.
*.switch.eth[*].macLayer.queue.numTrafficClasses = 3
*.switch.eth[*].macLayer.queue.classifier.typename = "ContentBasedClassifier"
*.switch.eth[*].macLayer.queue.classifier.packetFilters = ["Best-Effort*", "AVTP-*", "Gptp*"]
**.oscillator.nominalTickLength = 10ns
# gPTP timestamps frames at reception start, which needs the streaming PHY models.
**.eth[*].phyLayer.transmitter.typename = "StreamingTransmitter"
**.eth[*].phyLayer.receiver.typename = "DestreamingReceiver"

# Same drifting oscillators without gPTP: the free-running clocks diverge.
[Config AvtpTsnFreeRunning]
description = "IEEE 1722 TSCF over INET TSN, +/-50 ppm oscillators without time synchronization"
extends = AvtpTsn
*.gateway*.clock.typename = "SettableClock"
*.gateway*.app[0].clockModule = "^.clock"
*.gateway*.clock.oscillator.typename = "ConstantDriftOscillator"
*.gateway*.clock.oscillator.nominalTickLength = 10ns
*.gatewayA.clock.oscillator.driftRate = 50ppm
*.gatewayB.clock.oscillator.driftRate = -50ppm

# ---------------------------------------------------------------------------
# AUTOSAR E2E + SecOC (autosar/, docs/PROTECTION.md). The sending ECUs protect each
# frame, the receiving ECUs check it; gateways forward the bytes unchanged, so the
# protection is end-to-end over CAN -> Ethernet -> CAN. Each receiving ECU gets one
# sink per stream: sinkApp[0] for the Classical CAN stream (IDs 256/768, sent by
# ecu*[0]) and sinkApp[1] for the CAN-FD stream (IDs 512/1024, sent by ecu*[1]).
# DataIDs default to the CAN identifier; the key is shared by sender and receivers.
[Config E2eSecOc]
description = "E2E P01 (Classical CAN) / P05 (CAN-FD) inside SecOC AES-128-CMAC, proprietary tunnel"
*.ecu*[*].sourceApp[0].typename = "signalsandgateways.inet4.protection.SecuredCanSourceApp"
*.ecu*[*].sinkApp[*].typename = "signalsandgateways.inet4.protection.SecuredCanSink"
*.ecu*[*].numInputBuffer = 2
*.ecu*[*].numSinkApps = 2
*.ecuA[*].bufferIn[0].idIncomingFrames = "768"
*.ecuA[*].bufferIn[1].idIncomingFrames = "1024"
*.ecuB[*].bufferIn[0].idIncomingFrames = "256"
*.ecuB[*].bufferIn[1].idIncomingFrames = "512"
*.ecu*[*].bufferIn[1].destination_gates = "sinkApp[1].dataIn"
*.ecu*[*].bufferIn[*].MOB = false
**.secocKey = "2b7e151628aed2a6abf7158809cf4f3c"
**.e2eMaxDeltaCounter = 2
# Classical CAN 8B: | CRC | counter | 2 data bytes | FV (8 LSB) | MAC (24 MSB) |
*.ecu*[0].sourceApp[0].e2eProfile = "P01"
*.ecu*[*].sinkApp[0].e2eProfile = "P01"
*.ecu*[0].sourceApp[0].secocEnabled = true
*.ecu*[*].sinkApp[0].secocEnabled = true
# CAN-FD 64B: | CRC16 | counter | 51 data bytes | FV (16 LSB) | MAC (64 MSB) |
*.ecu*[1].sourceApp[0].e2eProfile = "P05"
*.ecu*[*].sinkApp[1].e2eProfile = "P05"
*.ecu*[1].sourceApp[0].secocEnabled = true
*.ecu*[*].sinkApp[1].secocEnabled = true
*.ecu*[1].sourceApp[0].secocFreshnessTxBits = 16
*.ecu*[*].sinkApp[1].secocFreshnessTxBits = 16
*.ecu*[1].sourceApp[0].secocMacTxBits = 64
*.ecu*[*].sinkApp[1].secocMacTxBits = 64

[Config E2eSecOcAvtp]
description = "E2eSecOc carried by IEEE 1722 NTSCF + ACF CAN (pcap for the wire check)"
extends = E2eSecOc, AvtpNtscf

# Profile 2 (E2E only) and Profile 7 inside SecOC with a 32 bit transmitted FV and the
# full 128 bit MAC, over TSCF. A 25 ms reception timeout would report NONEWDATA.
[Config E2eP02P07Avtp]
description = "E2E P02 without SecOC (Classical CAN) and P07 + SecOC (CAN-FD) over IEEE 1722 TSCF"
extends = E2eSecOc, AvtpTscf
*.ecu*[0].sourceApp[0].e2eProfile = "P02"
*.ecu*[*].sinkApp[0].e2eProfile = "P02"
**.e2eDataIdList = "0x10 0x21 0x32 0x43 0x54 0x65 0x76 0x87 0x98 0xa9 0xba 0xcb 0xdc 0xed 0xfe 0x0f"
*.ecu*[0].sourceApp[0].secocEnabled = false
*.ecu*[*].sinkApp[0].secocEnabled = false
*.ecu*[1].sourceApp[0].e2eProfile = "P07"
*.ecu*[*].sinkApp[1].e2eProfile = "P07"
*.ecu*[1].sourceApp[0].secocFreshnessTxBits = 32
*.ecu*[*].sinkApp[1].secocFreshnessTxBits = 32
*.ecu*[1].sourceApp[0].secocMacTxBits = 128
*.ecu*[*].sinkApp[1].secocMacTxBits = 128
*.ecu*[*].sinkApp[*].e2eReceptionTimeout = 25ms

# Fault injection on the Classical CAN stream of ecuA[0] (ID 256), 30 frames:
# frames 5, 20 and 21 have one bit error, frame 10 replays frame 9, frame 15 skips
# 3 counters. The burst (20, 21) drives the E2E state machine to INVALID and back.
# With SecOC outside E2E, corrupted and replayed PDUs are discarded by SecOC; E2E
# then sees the gaps (NONEWDATA, OKSOMELOST after frame 5, WRONGSEQUENCE at 15 and 22).
[Config E2eSecOcFaults]
description = "E2eSecOc with bit error, replay and counter jump on ID 256"
extends = E2eSecOc
sim-time-limit = 300ms
*.ecuA[0].sourceApp[0].faultCorruptAt = "5,20,21"
*.ecuA[0].sourceApp[0].faultReplayAt = "10"
*.ecuA[0].sourceApp[0].faultSkipAt = "15"
# 12 ms without a PDU that passed SecOC: the E2E check reports NONEWDATA.
*.ecuB[*].sinkApp[0].e2eReceptionTimeout = 12ms

[Config E2eOnlyFaults]
description = "Same faults with E2E only: ERROR, REPEATED, OKSOMELOST and WRONGSEQUENCE"
extends = E2eSecOcFaults
**.secocEnabled = false

[Config SecOcWrongKey]
description = "ecuA[0] signs ID 256 with a wrong key: every PDU fails SecOC verification"
extends = E2eSecOc
*.ecuA[0].sourceApp[0].secocKey = "2b7e151628aed2a6abf7158809cf4f3d"
